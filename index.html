<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>This blog has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://koalalikecode.duykhanhchi1993.workers.dev/" />
    <meta
      http-equiv="refresh"
      content="0; url=https://koalalikecode.duykhanhchi1993.workers.dev/"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcfcfc;
        --text: #18181b;
        --muted: #6b6a67;
        --accent: #c2410c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --text: #ededeb;
          --muted: #a1a09b;
          --accent: #fb923c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-family: ui-serif, Georgia, serif;
        font-weight: 500;
        font-size: 1.75rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--accent);
        text-underline-offset: 0.2em;
      }
    </style>
  </head>
  <body>
    <!--
      Every path is 301-redirected by vercel.json, so this page is only reached
      if a rule fails to match. It carries a meta refresh as a second line of
      defence and noindex so it never competes with the real site in search.
    -->
    <main>
      <h1>This blog has moved</h1>
      <p>koalalikecode now lives at a new address.</p>
      <p>
        <a href="https://koalalikecode.duykhanhchi1993.workers.dev/">
          koalalikecode.duykhanhchi1993.workers.dev
        </a>
      </p>
    </main>
  </body>
</html>
